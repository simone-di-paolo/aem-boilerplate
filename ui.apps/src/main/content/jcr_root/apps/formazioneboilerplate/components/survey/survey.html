<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html" />
<sly data-sly-call="${clientlib.js @ categories='formazioneboilerplate.myClientlib'}" />
<sly data-sly-call="${clientlib.css @ categories='formazioneboilerplate.myClientlib'}" />

<sly data-sly-use.myModel="com.formazioneboilerplate.core.models.SurveyModel"> </sly>


<form method="post" action="/bin/formhandlerbenedetta">
    <input type="hidden" name="name" value="${myModel.name}" />
    <input type="hidden" name="surname" value="${myModel.surname}" />
    <input type="hidden" name="birthdate" value="${myModel.birthdate}" />
    <input type="hidden" name="birthplace" value="${myModel.birthplace}" />
    <button type="submit">${myModel.labelSubmit}</button>
</form>


<div class="survey">
    <div class="name"> Name: ${myModel.name}</div>
    <div class="surname"> Surname: ${myModel.surname}</div>
    <div class="birthdate"> Birthdate: ${myModel.birthdate}</div>
    <div class="birthplace"> Birthplace: ${myModel.birthplace}</div>
</div>

<button class="OpenButton">
    <div id="button">  <a href="${myModel.linkSubmit}" target="_blank" class="link">${myModel.labelSubmit}</a></div>
</button>
