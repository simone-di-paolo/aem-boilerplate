<style>

    .site-menu{
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: white;
        padding: 30px;
        border-bottom: 1px solid white;
        font-family: sans-serif;
    }

    .menu-items{
        display: flex;
        gap: 30px;

    }

    .menu-items a{
        text-decoration: none;
        color: dimgray;
        position: relative;
        font-size: 12px;
        padding: 5px 0;
        transition: color 0.3s ease-in;
        text-transform: uppercase;
        border-bottom: 2px solid blue;
    }

             .menu-items a:hover {
                 color: red;

             }


</style>

<nav class="site-menu">

    <sly data-sly-test.logo="${pageProperties.logoImage @context='html'}">
        <img src="${logo @context='uri'}" alt= 'Logo'>
    </sly>

    <sly data-sly-list.item="${resource.listChildren}">
        <sly data-sly-test="${item.name == 'menuItems'}">
            <sly data-sly-list.subitem="${item.listChildren}">

                <div class="menu-items">
                    <a href="${subitem.link @context='uri'}">${subitem.label @context='html'}</a>
                </div>
            </sly>
        </sly>

</nav>
